name: Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify SUT_REPO is configured
        run: |
          if [ -z "${{ vars.SUT_REPO }}" ]; then
            echo "::error::Repo variable SUT_REPO is unset."
            echo "::error::Set it under Settings → Secrets and variables → Actions → Variables"
            echo "::error::to the owner/name of the SUT repo (e.g. acme/example-e-commerce-website)."
            echo "::error::Optionally also set SUT_REF (default: main)."
            exit 1
          fi

      - name: Checkout test suite
        uses: actions/checkout@v5
        with:
          path: northwind-qa

      - name: Checkout SUT
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.SUT_REPO }}
          ref: ${{ vars.SUT_REF || 'main' }}
          path: example-e-commerce-website
          # SUT lives in a separate repo. When that repo is private, the
          # default GITHUB_TOKEN cannot read it (its scope is this repo
          # only). Use a deploy key pinned to the SUT repo:
          #   1. Generate an ed25519 keypair locally.
          #   2. Add the public half to the SUT repo's deploy keys
          #      (Settings -> Deploy keys, read-only).
          #   3. Save the private half as the SUT_DEPLOY_KEY secret here.
          # If SUT_DEPLOY_KEY is unset (SUT is public), checkout falls
          # back to https + GITHUB_TOKEN automatically.
          ssh-key: ${{ secrets.SUT_DEPLOY_KEY }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: northwind-qa/package-lock.json

      - name: Install SUT
        working-directory: example-e-commerce-website
        run: |
          corepack enable
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else npm ci; fi

      - name: Install test suite
        working-directory: northwind-qa
        run: npm ci

      - name: Install Playwright browsers
        working-directory: northwind-qa
        run: npx playwright install --with-deps chromium

      - name: Run tests
        working-directory: northwind-qa
        env:
          CI: 'true'
          E2E_SUT_DIR: ${{ github.workspace }}/example-e-commerce-website
        run: npm test

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: northwind-qa/playwright-report
          retention-days: 14
